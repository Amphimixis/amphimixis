# Example Configuration File
# Ready-to-edit templates: amixis init local | distributed | distributed-cross

# build_system:
# runner:

platforms:
- id: 1
  arch: x86            # Available: x86, riscv, arm
                       # no 'address' = local machine
# Remote machine example:
# - id: 2
#   arch: riscv        # Available: x86, riscv, arm
#   address:
#   username:
#   password:
#   port: 22           # default: 22

recipes:
- id: 1
  config_flags:
    -DCMAKE_BUILD_TYPE=RelWithDebInfo
    -DYAML_CPP_BUILD_TESTS=ON
  compiler_flags:
    cxx_flags: "-O2"   # compare builds with different flags
  # jobs:
  # toolchain:
  #   cxx_compiler: /usr/bin/g++
  # sysroot: /

builds:
- build_machine: 1     # platform id where the project is built
  run_machine: 1       # platform id where perf profiles executables
  recipe_id: 1
  # executables:
  #   - bin/my_app     # relative to build dir
